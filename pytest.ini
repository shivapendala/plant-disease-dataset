[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --verbose --cov=backend --cov=ml_engine --cov-report=term-missing --cov-report=html
markers =
    unit: Fast unit tests without I/O
    integration: Integration tests involving database or mock services
    inference: Machine learning model inference and Grad-CAM tests
    slow: Tests that execute neural network forward passes
