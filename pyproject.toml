[tool.poetry]
name = "floraguard-plant-disease-ai"
version = "2.4.0"
description = "Enterprise Plant Pathology, Leaf Disease Classification & Agronomic Advisory Platform"
authors = ["FloraGuard Engineering Team <agri-engineering@floraguard.internal>"]
readme = "README.md"
packages = [{include = "backend"}, {include = "ml_engine"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.28"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
torch = ">=2.0.0"
torchvision = ">=0.15.0"
numpy = "^1.26.4"
scikit-learn = "^1.4.1"
pillow = "^10.2.0"
opencv-python-headless = "^4.9.0.80"
httpx = "^0.27.0"
redis = "^5.0.3"
celery = "^5.3.6"
prometheus-client = "^0.20.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
flake8 = "^7.0.0"
mypy = "^1.9.0"
black = "^24.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=backend --cov=ml_engine --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
