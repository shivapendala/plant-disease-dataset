version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: floraguard_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://floraguard:secure_pg_pass@postgres:5432/floraguard_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - INFERENCE_DEVICE=cpu
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./ml_models:/app/ml_models
    networks:
      - floraguard_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floraguard_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - floraguard_net

  postgres:
    image: postgres:15-alpine
    container_name: floraguard_postgres
    restart: always
    environment:
      POSTGRES_USER: floraguard
      POSTGRES_PASSWORD: secure_pg_pass
      POSTGRES_DB: floraguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - floraguard_net

  redis:
    image: redis:7-alpine
    container_name: floraguard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - floraguard_net

  nginx:
    image: nginx:alpine
    container_name: floraguard_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - floraguard_net

networks:
  floraguard_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
